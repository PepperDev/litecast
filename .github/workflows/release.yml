name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Semver tag (e.g. v1.2.3). Leave empty to auto-increment from latest.
        type: string
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: alpine
    steps:
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          wget -qO /tmp/release \
            --header="Authorization: Bearer $GITHUB_TOKEN" \
            --header="Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/contents/.github/scripts/release?ref=$GITHUB_SHA"
          sh -e /tmp/release
